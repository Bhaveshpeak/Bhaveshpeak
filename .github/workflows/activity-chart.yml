name: Update activity chart

on:
  workflow_dispatch:
  push:
    paths:
      - README.md
      - .github/workflows/activity-chart.yml
  schedule:
    - cron: '17 6 * * *'

permissions:
  contents: write

jobs:
  update-chart:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Generate activity chart
        uses: dturovskiy/deus-commit-chart@v1.5.3
        with:
          source: github
          username: ${{ github.repository_owner }}
          token: ${{ github.token }}
          default-days: '365'
          ranges: '365'
          layout: spacious
          output-dir: activity-dist

      - name: Publish chart to profile repository
        run: |
          cp activity-dist/activity-365d.svg activity-365d.svg
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add activity-365d.svg
          if git diff --cached --quiet; then
            echo "Chart is already up to date."
          else
            git commit -m "Update activity chart"
            git push
          fi
